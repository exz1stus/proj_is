services:
    # ── PostgreSQL ──────────────────────────────────────────────────────────────
    postgres:
        image: postgres:16-alpine
        container_name: inventory_postgres
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-inventory_user}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inventory_pass}
            POSTGRES_DB: ${POSTGRES_DB:-inventory_db}
        volumes:
            - postgres_data:/var/lib/postgresql/data
        ports:
            - "5432:5432"
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U ${POSTGRES_USER:-inventory_user} -d ${POSTGRES_DB:-inventory_db}",
                ]
            interval: 5s
            timeout: 5s
            retries: 10

    # ── Backend ─────────────────────────────────────────────────────────────────
    backend:
        build:
            context: ./backend
            dockerfile: Dockerfile
        container_name: inventory_backend
        restart: unless-stopped
        depends_on:
            postgres:
                condition: service_healthy
        environment:
            NODE_ENV: production
            PORT: 3000
            DATABASE_URL: postgresql://${POSTGRES_USER:-inventory_user}:${POSTGRES_PASSWORD:-inventory_pass}@postgres:5432/${POSTGRES_DB:-inventory_db}
            JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
            EXCHANGE_RATE_API_KEY: ${EXCHANGE_RATE_API_KEY:-}
            DB_HOST: postgres
            DB_PORT: 5432
        ports:
            - "3000:3000"
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "wget -qO- http://localhost:3000/health || exit 1",
                ]
            interval: 10s
            timeout: 5s
            retries: 5

    # ── Frontend ─────────────────────────────────────────────────────────────────
    frontend:
        build:
            context: ./frontend
            dockerfile: Dockerfile
            args:
                VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
        container_name: inventory_frontend
        restart: unless-stopped
        depends_on:
            backend:
                condition: service_healthy
        ports:
            - "80:80"
        healthcheck:
            test: ["CMD-SHELL", "wget -qO- http://localhost:80 || exit 1"]
            interval: 10s
            timeout: 5s
            retries: 5

volumes:
    postgres_data:
